[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labelvid"
description = "Video Clipping Tool for Frame Extraction - Works with Labelme"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.10"
authors = [{ name = "LabelVid Team" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "loguru",
  "natsort>=7.1.0",
  "numpy",
  "opencv-python>=4.5.0",
  "pillow>=2.8",
  "pyqt5>=5.14.0",
  "pyqt5-qt5!=5.15.13 ; sys_platform == 'linux'",
  "pyqt5-qt5!=5.15.11,!=5.15.12,!=5.15.13,!=5.15.14,!=5.15.15,!=5.15.16 ; sys_platform == 'win32'",
  "scikit-image>=0.19.0",  # For polygon_from_mask
]

[project.optional-dependencies]
ai = [
  "osam",  # For SAM-based annotation
  "imgviz>=1.4.0",  # For image visualization
]
whisper = [
  "openai-whisper>=20231117",  # For speech recognition and caption extraction
  "ffmpeg-python>=0.2.0",  # For audio extraction
]
all = [
  "labelvid[ai,whisper]",
]
version = "0.1.0"
readme = "README.md"

[dependency-groups]
dev = [
  "ipython",
  "pyqt5-stubs>=5.15.6.0",
  "pytest>=8.3.4",
  "pytest-qt>=4.4.0",
  "ruff~=0.12.11",
]

[project.scripts]
labelvid = "labelvid.__main__:main"

[tool.pytest.ini_options]
qt_api = "pyqt5"

[tool.ruff.lint]
select = [
  "E",  # pycodestyle
  "F",  # pyflakes
  "I",  # isort
  "UP",  # pyupgrade
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
